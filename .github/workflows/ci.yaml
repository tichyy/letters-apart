name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: '0.13.8'
          python-version: '3.14'

      - name: Test backend
        run: uv run --locked pytest -q

      - name: Build app
        run: docker compose build
